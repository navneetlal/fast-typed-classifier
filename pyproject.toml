[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "fast-typed-classifier"
version = "0.1.0"
description = "gRPC microservice for typed-decision classification with Laya"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    # The engine batches with Laya's Agent internals (_encode_state, _forward, _decode_answers),
    # so the version is pinned exactly; tests/test_real_models.py checks parity with Router.predict.
    "laya==0.3.20",
    "grpcio>=1.84",
    "grpcio-health-checking>=1.84",
    "grpcio-reflection>=1.84",
    "protobuf>=6.31",
]

[project.optional-dependencies]
dev = ["grpcio-tools>=1.84", "pytest>=8"]

[project.scripts]
fast-typed-classifier = "fast_typed_classifier.server:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["models: loads the real Laya checkpoints (slow; needs the models in .hf-cache/)"]
addopts = "-ra"
